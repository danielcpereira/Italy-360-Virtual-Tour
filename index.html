<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Visita Virtual 360º</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <!-- cursor -->
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 30">

    <!-- photos (4096x2048, JPG) -->
    <a-assets timeout="20000">
      <img id="scene1" src="photos/palermo_sidewalk.jpg" crossorigin="anonymous">
      <img id="scene2" src="photos/venice_sunset.jpg" crossorigin="anonymous">
      <img id="scene3" src="photos/colosseum.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- first photo -->
    <a-sky id="sky" src="#scene1"></a-sky>

    <a-entity id="content"></a-entity>

    <!-- user: camera and VR controllers-->
    <a-entity id="rig">
      <a-entity camera look-controls wasd-controls="enabled: false" position="0 1.6 0">
        <!-- transition between photos -->
        <a-entity id="fade"
                  visible="false"
                  geometry="primitive: sphere; radius: 0.3"
                  material="shader: flat; color: #000; side: back; transparent: true; opacity: 0; depthTest: false">
        </a-entity>
      </a-entity>
      <a-entity laser-controls="hand: left"  raycaster="objects: .clickable; far: 30"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 30"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const SCENES = {
      scene1: {
        image: '#scene1',
        skyRotation: -230,
        angle: 0,
        panel: {
          title: 'Centro Histórico, Palermo',
          text: 'Capital da Sicília, Palermo foi fundada pelos fenícios há quase três mil anos. Árabes, normandos e espanhóis deixaram aqui a sua marca, visível nas ruas estreitas, varandas de ferro e fachadas barrocas. O seu património árabe-normando é Património Mundial da UNESCO.'
        },
        portals: [
          { target: 'scene2', name: 'Veneza' },
          { target: 'scene3', name: 'Roma' }
        ]
      },
      scene2: {
        image: '#scene2',
        skyRotation: 100,
        angle: 0,
        panel: {
          title: 'Lagoa de Veneza',
          text: 'Veneza ergue-se sobre mais de cem pequenas ilhas, assente em milhares de estacas de madeira. Ao fundo, ao pôr do sol, destacam-se os campanários de San Giorgio Maggiore e da Praça de São Marcos. A cidade e a sua lagoa são Património Mundial da UNESCO desde 1987.'
        },
        portals: [
          { target: 'scene1', name: 'Palermo' },
          { target: 'scene3', name: 'Roma' }
        ]
      },
      scene3: {
        image: '#scene3',
        skyRotation: -120,
        angle: 0,
        panel: {
          title: 'Coliseu, Roma',
          text: 'Construído entre 70 e 80 d.C., durante a dinastia Flávia, o Coliseu é o maior anfiteatro alguma vez erguido pelo Império Romano. Recebia mais de 50 mil espectadores para combates de gladiadores e espetáculos públicos. A calçada onde estás é de basalto, original da época romana.'
        },
        portals: [
          { target: 'scene1', name: 'Palermo' },
          { target: 'scene2', name: 'Veneza' }
        ]
      }
    };
    const INITIAL_SCENE = 'scene1';
    const PORTAL_SPACING = 36;   // degrees between the panel and portals
    const ACCENT_COLOR = '#4da3ff';    // interface color

    const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

    /* =====================================================================
       COMPONENT: PORTAL
       ===================================================================== */

    const PORTAL_VERTEX = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    // Crop of the 360º photo without distortion (same degrees horizontally and vertically)
    const PORTAL_FRAGMENT = `
      uniform sampler2D uTex;
      uniform float uHover;
      varying vec2 vUv;
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float r = length(p);
        float fov = 0.07;                       // ~25º to each side
        vec2 texUv = vec2(0.5 + p.x * fov, 0.5 + p.y * fov * 2.0);
        vec3 color = texture2D(uTex, texUv).rgb;
        color *= mix(0.78, 1.0, uHover);            // darker when idle
        color *= 1.0 - 0.25 * smoothstep(0.6, 1.0, r);  // soft vignette
        gl_FragColor = vec4(color, 1.0);
      }
    `;

    const photoTextures = {};
    function photoTexture(imgEl) {
      if (!photoTextures[imgEl.id]) {
        const t = new THREE.Texture(imgEl);
        t.needsUpdate = true;
        photoTextures[imgEl.id] = t;
      }
      return photoTextures[imgEl.id];
    }

    const noRaycast = () => {}; // only the window detects the ray

    AFRAME.registerComponent('portal', {
      schema: { image: { type: 'selector' } },

      init: function () {
        const RADIUS = 0.42;
        this.hover = 0;
        this.hoverTarget = 0;
        this.baseColor = new THREE.Color('#ffffff');
        this.accentColor = new THREE.Color(ACCENT_COLOR);

        const group = new THREE.Group();
        this.group = group;

        // Window with the preview
        this.windowMaterial = new THREE.ShaderMaterial({
          uniforms: { uTex: { value: photoTexture(this.data.image) }, uHover: { value: 0 } },
          vertexShader: PORTAL_VERTEX,
          fragmentShader: PORTAL_FRAGMENT
        });
        group.add(new THREE.Mesh(new THREE.CircleGeometry(RADIUS, 96), this.windowMaterial));

        // Thin rim
        this.rim = new THREE.Mesh(
          new THREE.RingGeometry(RADIUS, RADIUS + 0.012, 96),
          new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.9 })
        );
        this.rim.position.z = 0.002;
        this.rim.raycast = noRaycast;
        group.add(this.rim);

        // Focus ring (only appears on hover)
        this.focus = new THREE.Mesh(
          new THREE.RingGeometry(RADIUS + 0.045, RADIUS + 0.052, 96),
          new THREE.MeshBasicMaterial({ color: ACCENT_COLOR, transparent: true, opacity: 0 })
        );
        this.focus.position.z = 0.002;
        this.focus.raycast = noRaycast;
        group.add(this.focus);

        this.el.setObject3D('portal', group);

        this.el.addEventListener('mouseenter', () => { this.hoverTarget = 1; });
        this.el.addEventListener('mouseleave', () => { this.hoverTarget = 0; });
      },

      tick: function (t, dt) {
        if (!dt) return;
        this.hover += (this.hoverTarget - this.hover) * Math.min(1, (dt / 1000) * 12);
        const h = this.hover;
        this.windowMaterial.uniforms.uHover.value = h;
        this.rim.material.color.copy(this.baseColor).lerp(this.accentColor, h);
        this.focus.material.opacity = h * 0.9;
        const s = 1 + h * 0.06;
        this.group.scale.set(s, s, s);
      },

      remove: function () {
        this.el.removeObject3D('portal');
        this.group.traverse((o) => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) o.material.dispose();
        });
      }
    });

    /* ===================================================================== */

    const sceneEl   = document.querySelector('a-scene');
    const sky      = document.querySelector('#sky');
    const content = document.querySelector('#content');
    const fadeEl   = document.querySelector('#fade');
    let currentScene = null;
    let isChanging = false;

    // Position on a circle around the user
    function positionFromAngle(angle, distance, height) {
      const rad = THREE.MathUtils.degToRad(angle);
      return { x: -Math.sin(rad) * distance, y: height, z: -Math.cos(rad) * distance };
    }

    // ---------- Canvas drawing (supports accents: ã, ç, é...) ----------
    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function wrapLines(ctx, text, maxWidth) {
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const p of words) {
        const test = line ? line + ' ' + p : p;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = p;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function truncate(ctx, text, maxWidth) {
      let t = text;
      while (ctx.measureText(t).width > maxWidth && t.length > 3) t = t.slice(0, -2);
      return t === text ? t : t.trim() + '…';
    }

    function panelTexture(title, text) {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 576;
      const ctx = c.getContext('2d');

      ctx.fillStyle = 'rgba(16, 18, 22, 0.86)';
      roundedRect(ctx, 0, 0, c.width, c.height, 24);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      roundedRect(ctx, 1, 1, c.width - 2, c.height - 2, 23);
      ctx.stroke();

      // small label + accent bar
      ctx.fillStyle = ACCENT_COLOR;
      ctx.fillRect(64, 64, 40, 4);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.font = `600 26px ${FONT}`;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('INFORMAÇÃO', 120, 74);

      ctx.fillStyle = '#ffffff';
      ctx.font = `600 58px ${FONT}`;
      ctx.fillText(truncate(ctx, title, 800), 64, 150);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
      ctx.font = `38px ${FONT}`;
      const lines = wrapLines(ctx, text, c.width - 128);
      lines.slice(0, 7).forEach((l, i) => ctx.fillText(l, 64, 226 + i * 52));

      return c.toDataURL();
    }

    function labelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = `600 24px ${FONT}`;
      ctx.fillText('IR PARA', c.width / 2, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = `600 46px ${FONT}`;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 12;
      ctx.fillText(truncate(ctx, text, 480), c.width / 2, 92);
      return c.toDataURL();
    }

    // ---------- vibration and sound----------
    let audioCtx = null;
    function tone(freqStart, freqEnd, dur, volume) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freqStart, now);
        o.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(volume, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.connect(g).connect(audioCtx.destination);
        o.start(now);
        o.stop(now + dur);
      } catch (e) {}
    }
    const hoverSound  = () => tone(1200, 1200, 0.04, 0.03); 
    const clickSound = () => tone(660, 440, 0.12, 0.07);     

    function vibrate(evt, intensity, ms) {
      try {
        const controller = evt.detail && evt.detail.cursorEl;
        const tc = controller && controller.components['tracked-controls'];
        const gamepad = tc && tc.controller && tc.controller.gamepad;
        if (gamepad && gamepad.hapticActuators && gamepad.hapticActuators[0]) {
          gamepad.hapticActuators[0].pulse(intensity, ms);
        }
      } catch (e) {}
    }

    // ---------- information panel minimizable ----------
    let panelMinimized = false;

    function buttonTexture(symbol, hover) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.beginPath(); ctx.arc(64, 64, 56, 0, Math.PI * 2);
      ctx.fillStyle = hover ? ACCENT_COLOR : '#2a2d33';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = hover ? ACCENT_COLOR : 'rgba(255, 255, 255, 0.35)';
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(42, 64); ctx.lineTo(86, 64); ctx.stroke();
      if (symbol === '+') { ctx.beginPath(); ctx.moveTo(64, 42); ctx.lineTo(64, 86); ctx.stroke(); }
      return c.toDataURL();
    }

    function tabTexture(title, hover) {
      const c = document.createElement('canvas');
      c.width = 640; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(16, 18, 22, 0.86)';
      roundedRect(ctx, 2, 2, c.width - 4, c.height - 4, 20);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = hover ? ACCENT_COLOR : 'rgba(255, 255, 255, 0.15)';
      ctx.stroke();

      ctx.fillStyle = ACCENT_COLOR;
      ctx.fillRect(40, 62, 28, 4);
      ctx.fillStyle = '#ffffff';
      ctx.font = `600 42px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.fillText(truncate(ctx, title, 420), 86, 66);

      ctx.strokeStyle = hover ? ACCENT_COLOR : 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(566, 64); ctx.lineTo(598, 64); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(582, 48); ctx.lineTo(582, 80); ctx.stroke();
      return c.toDataURL();
    }

    function refreshRaycasters() {
      document.querySelectorAll('[raycaster]').forEach((r) => {
        if (r.components.raycaster) r.components.raycaster.refreshObjects();
      });
    }

    // Normal / hover / click states for the panel buttons
    function withHover(el, texNormal, texHover, onClick) {
      el.addEventListener('mouseenter', (evt) => {
        el.setAttribute('material', 'src', texHover);
        hoverSound();
        vibrate(evt, 0.15, 15);
      });
      el.addEventListener('mouseleave', () => el.setAttribute('material', 'src', texNormal));
      el.addEventListener('click', (evt) => {
        clickSound();
        vibrate(evt, 0.35, 30);
        el.setAttribute('material', 'src', texNormal);
        onClick();
      });
    }

    function createPanel(scene) {
      const group = document.createElement('a-entity');
      group.setAttribute('position', positionFromAngle(scene.angle, 3, 1.6));
      group.setAttribute('rotation', { x: 0, y: scene.angle, z: 0 });

      const full = document.createElement('a-entity');
      full.setAttribute('geometry', { primitive: 'plane', width: 1.6, height: 0.9 });
      full.setAttribute('material', {
        shader: 'flat', transparent: true, side: 'double',
        src: panelTexture(scene.panel.title, scene.panel.text)
      });

      const texMin = buttonTexture('–', false);
      const texMinHover = buttonTexture('–', true);
      const button = document.createElement('a-entity');
      button.setAttribute('position', '0.68 0.33 0.01');
      button.setAttribute('geometry', { primitive: 'plane', width: 0.11, height: 0.11 });
      button.setAttribute('material', { shader: 'flat', transparent: true, alphaTest: 0.5, src: texMin });
      full.appendChild(button);

      const texTab = tabTexture(scene.panel.title, false);
      const texTabHover = tabTexture(scene.panel.title, true);
      const tab = document.createElement('a-entity');
      tab.setAttribute('position', '0 0.35 0');
      tab.setAttribute('geometry', { primitive: 'plane', width: 1.0, height: 0.2 });
      tab.setAttribute('material', { shader: 'flat', transparent: true, side: 'double', src: texTab });

      group.appendChild(full);
      group.appendChild(tab);

      function apply(animate) {
        const min = panelMinimized;
        full.setAttribute('visible', !min);
        tab.setAttribute('visible', min);
        if (min) { tab.classList.add('clickable'); button.classList.remove('clickable'); }
        else     { button.classList.add('clickable'); tab.classList.remove('clickable'); }
        if (animate) {
          const target = min ? tab : full;
          target.removeAttribute('animation__open');
          target.setAttribute('animation__open',
            { property: 'scale', from: '1 0.85 1', to: '1 1 1', dur: 180, easing: 'easeOutQuad' });
        }
        refreshRaycasters();
      }

      withHover(button, texMin, texMinHover, () => { panelMinimized = true;  apply(true); });
      withHover(tab,   texTab, texTabHover, () => { panelMinimized = false; apply(true); });

      apply(false);
      return group;
    }

    // ---------- Portal ----------
    function createPortal(portal, angle) {
      const target = SCENES[portal.target];
      const el = document.createElement('a-entity');
      el.classList.add('clickable');
      el.setAttribute('position', positionFromAngle(angle, 3.2, 1.55));
      el.setAttribute('rotation', { x: 0, y: angle, z: 0 });
      el.setAttribute('portal', { image: target.image });

      const label = document.createElement('a-entity');
      label.setAttribute('position', '0 -0.62 0');
      label.setAttribute('geometry', { primitive: 'plane', width: 0.8, height: 0.2 });
      label.setAttribute('material', {
        shader: 'flat', transparent: true, src: labelTexture(portal.name)
      });
      el.appendChild(label);

      el.addEventListener('mouseenter', (evt) => { hoverSound(); vibrate(evt, 0.2, 20); });
      el.addEventListener('click', (evt) => {
        clickSound();
        vibrate(evt, 0.5, 50);
        goTo(portal.target);
      });
      return el;
    }

    // ---------- Scene change with fade to black ----------
    function fade(target, duration) {
      return new Promise((resolve) => {
        fadeEl.object3D.visible = true;
        const done = () => {
          fadeEl.removeEventListener('animationcomplete__fade', done);
          if (target === 0) fadeEl.object3D.visible = false;
          resolve();
        };
        fadeEl.addEventListener('animationcomplete__fade', done);
        fadeEl.setAttribute('animation__fade',
          { property: 'material.opacity', to: target, dur: duration, easing: 'easeInOutQuad' });
      });
    }

    function showScene(id) {
      const scene = SCENES[id];
      currentScene = id;
      sky.setAttribute('src', scene.image);
      sky.setAttribute('rotation', { x: 0, y: scene.skyRotation || 0, z: 0 });
      while (content.firstChild) content.removeChild(content.firstChild);
      content.appendChild(createPanel(scene));
      // left portal and right portal, one on each side of the panel
      content.appendChild(createPortal(scene.portals[0], scene.angle + PORTAL_SPACING));
      content.appendChild(createPortal(scene.portals[1], scene.angle - PORTAL_SPACING));
    }

    async function goTo(id) {
      if (isChanging || id === currentScene) return;
      isChanging = true;
      await fade(1, 400);
      showScene(id);
      await new Promise((r) => setTimeout(r, 100));
      await fade(0, 450);
      isChanging = false;
    }

    // Startup
    function start() { showScene(INITIAL_SCENE); }
    if (sceneEl.hasLoaded) start();
    else sceneEl.addEventListener('loaded', start);
  </script>
</body>
</html>
